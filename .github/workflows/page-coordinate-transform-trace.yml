name: Trace ReadEra Page Coordinate Transform
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  coordinate-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download the existing JADX analysis artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/13240431624/zip" \
            -o /tmp/readera-static-analysis.zip
          mkdir -p /tmp/readera-static
          unzip -q /tmp/readera-static-analysis.zip -d /tmp/readera-static
      - name: Trace page size and coordinate normalization call sites
        run: |
          mkdir -p analysis
          python3 - <<'PY'
          from pathlib import Path

          root = Path("/tmp/readera-static")
          target_names = {
              "AbstractC2468y.java", "C2454k.java", "C0823q.java",
              "C0825s.java", "C3684b.java", "AbstractC3568c.java",
              "JniDoc.java", "ReadSurface.java"
          }
          terms = (
              "m11551a", "m5646C", "m5719p0", "m19131q",
              "pageGetSizeJni", "getRotation", "setRotation",
              "getCropBox", "getMediaBox", "cropBox", "pageWidth",
              "pageHeight", "RectF", "pageRender"
          )
          relevant = {}
          call_sites = {}
          for path in root.rglob("*.java"):
              try:
                  lines = path.read_text(errors="replace").splitlines()
              except Exception:
                  continue
              name = path.name
              hits = [i for i, line in enumerate(lines) if any(term in line for term in terms)]
              if name in target_names and hits:
                  selected = set()
                  for i in hits:
                      for j in range(max(0, i-10), min(len(lines), i+24)):
                          selected.add(j)
                  relevant[str(path.relative_to(root))] = (lines, sorted(selected))
              if name not in target_names and hits:
                  chosen = [i for i in hits if any(term in lines[i] for term in
                            ("JniDoc.m19131q", "m19131q(", "m5646C()", "m5719p0("))]
                  if chosen:
                      selected = set()
                      for i in chosen[:20]:
                          for j in range(max(0, i-5), min(len(lines), i+12)):
                              selected.add(j)
                      call_sites[str(path.relative_to(root))] = (lines, sorted(selected))
          report = [
              "# ReadEra page-coordinate transform trace",
              "",
              "Reuses the completed JADX artifact; APK decompilation is not repeated.",
              "",
              "## Relevant decompiled class paths"
          ]
          for path in sorted(relevant):
              report.append(f"- `{path}`")
          report.extend(["", "## Page model, size and viewport source windows"])
          for path, (lines, selected) in sorted(relevant.items()):
              report.extend([f"### `{path}`", "", "```java"])
              previous = -2
              for idx in selected:
                  if idx > previous + 1:
                      report.append("...")
                  report.append(f"{idx+1}: {lines[idx]}")
                  previous = idx
              report.extend(["```", ""])
          report.extend(["## Cross-class call sites for page dimensions and viewport rectangles"])
          for path, (lines, selected) in sorted(call_sites.items()):
              report.extend([f"### `{path}`", "", "```java"])
              previous = -2
              for idx in selected:
                  if idx > previous + 1:
                      report.append("...")
                  report.append(f"{idx+1}: {lines[idx]}")
                  previous = idx
              report.extend(["```", ""])
          report.extend([
              "## Questions answered by this evidence",
              "- Normalized rectangle to viewport transform",
              "- Viewport to normalized touch-coordinate transform at base zoom and scaled zoom",
              "- pageGetSizeJni result-array call sites and page dimension source",
              "- Whether rotation/crop offsets are applied in Java or remain inside native page geometry"
          ])
          Path("analysis/readera-page-coordinate-transform.md").write_text("\n".join(report))
          print("\n".join(report[:220]))
          PY
      - name: Publish coordinate trace into repository documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          report = Path("analysis/readera-page-coordinate-transform.md").read_bytes()
          payload = {
              "message": "Document ReadEra page coordinate trace",
              "content": base64.b64encode(report).decode("ascii"),
              "branch": "main"
          }
          Path("/tmp/coordinate-report-payload.json").write_text(json.dumps(payload))
          PY
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/docs/READERA_PAGE_COORDINATE_TRANSFORM.md" \
            --input /tmp/coordinate-report-payload.json
      - uses: actions/upload-artifact@v4
        with:
          name: readera-page-coordinate-transform
          path: analysis/readera-page-coordinate-transform.md
          retention-days: 14

name: Android Debug Build

on:
  push:
    branches: [main]
    paths:
      - 'UniversalMobileControl/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UniversalMobileControl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate project structure
        run: python3 tests/validate_project.py

      - name: Run MCP adapter tests
        run: python3 -m unittest discover -s tests -v

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UMC-2.0-debug-apk
          path: UniversalMobileControl/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

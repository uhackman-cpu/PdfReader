name: Trace ReadEra Native Rectangle Helpers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  helper-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install disassembly tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu llvm
      - name: Extract native library
        run: |
          mkdir -p native analysis
          for apk in *.apk; do
            if unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libreadera.so'; then
              unzip -p "$apk" lib/arm64-v8a/libreadera.so > native/libreadera.so
              break
            fi
          done
          test -s native/libreadera.so
          aarch64-linux-gnu-readelf -S --wide native/libreadera.so > analysis/sections.txt
          aarch64-linux-gnu-readelf -l --wide native/libreadera.so > analysis/segments.txt
      - name: Disassemble helper ranges called by bookmarkRectJni
        run: |
          {
            echo '# Range 0x81e00-0x83a00: helpers called from bookmarkRectJni'
            llvm-objdump -d --demangle --no-show-raw-insn --start-address=0x81e00 --stop-address=0x83a00 native/libreadera.so
            echo
            echo '# Range 0x68000-0x68600: cache/tree helper invoked by bookmarkRectJni'
            llvm-objdump -d --demangle --no-show-raw-insn --start-address=0x68000 --stop-address=0x68600 native/libreadera.so
            echo
            echo '# Range around pageXPathFromCoordsJni'
            llvm-objdump -d --demangle --no-show-raw-insn --start-address=0x77900 --stop-address=0x77d00 native/libreadera.so
            echo
            echo '# Relocations and dynamic symbols near native helpers'
            aarch64-linux-gnu-readelf -rW native/libreadera.so
          } > analysis/rectangle_helpers_disassembly.txt
      - name: Extract printable strings near PDF/text layout implementation
        run: |
          strings -a -t x native/libreadera.so | grep -iE 'xpath|bookmark|rect|quad|glyph|char|text|page|clip|bound|annotation|highlight|font|line|word' > analysis/native_text_strings.txt || true
      - name: Report and upload
        run: |
          {
            echo '# ReadEra native rectangle helper trace'
            echo
            echo '## ELF sections'
            cat analysis/sections.txt
            echo
            echo '## ELF segments'
            cat analysis/segments.txt
            echo
            echo '## Helper disassembly'
            cat analysis/rectangle_helpers_disassembly.txt
            echo
            echo '## Related strings'
            cat analysis/native_text_strings.txt
          } > analysis/REPORT_RECTANGLE_HELPERS.md
      - uses: actions/upload-artifact@v4
        with:
          name: readera-rectangle-helper-trace
          path: analysis/
          retention-days: 7
